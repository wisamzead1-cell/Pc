<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PS4 Host - صفحة المضيف</title>
    <style>
        body {
            background-color: #0d1117;
            color: #c9d1d9;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            margin: 0;
            padding: 40px 20px;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
            background: #161b22;
            padding: 30px;
            border-radius: 12px;
            border: 1px solid #30363d;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }
        .title {
            font-size: 22px;
            font-weight: bold;
            color: #58a6ff;
            margin-bottom: 15px;
        }
        .status-box {
            margin: 20px 0;
            padding: 15px;
            background-color: #21262d;
            border: 1px solid #363b42;
            border-radius: 8px;
            font-size: 16px;
            color: #8b949e;
        }
        .btn {
            background-color: #238636;
            color: white;
            padding: 12px 24px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
            transition: 0.2s;
        }
        .btn:hover {
            background-color: #2ea043;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="title">صفحة المضيف الخاصة بك</div>
        
        <div class="status-box" id="status">
            الصفحة جاهزة للعمل
        </div>

        <button class="btn" onclick="handleClick()">إعادة تشغيل الجهاز</button>
    </div>

    <script>
        function handleClick() {
            document.getElementById('status').innerText = 'جاري معالجة الطلب...';
            document.getElementById('status').style.color = '#58a6ff';
        }
    </script>

</body>
</html>
